name: Release

# Publica el instalador NSIS como GitHub Release cuando se pushea un tag
# vX.Y.Z. El flujo completo esta en docs/10-build-windows.md:
#   bun run bump X.Y.Z && git commit && git tag vX.Y.Z && git push --tags

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/ui/src-tauri -> target

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verificar que el tag coincida con la version
        shell: pwsh
        run: |
          $v = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ("v$v" -ne "${{ github.ref_name }}") {
            throw "El tag ${{ github.ref_name }} no coincide con la version v$v de package.json. Corre 'bun run bump' antes de taggear."
          }

      - name: Typecheck
        run: bun run typecheck

      - name: Run service tests
        run: bun run test

      - name: Build service binary
        run: bun run build:service:windows

      - name: Stage service binary into Tauri resources
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path apps/ui/src-tauri/binaries | Out-Null
          Copy-Item apps/service/dist/xs20-service.exe apps/ui/src-tauri/binaries/xs20-service.exe -Force

      - name: Build Tauri app
        run: bun run tauri:build

      # Nombre estable y sin espacios: GitHub reemplaza espacios por puntos en
      # los assets y el update-checker del servicio matchea el sufijo -setup.exe.
      - name: Renombrar instalador y calcular SHA-256
        shell: pwsh
        run: |
          $v = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $src = Get-ChildItem "apps/ui/src-tauri/target/release/bundle/nsis/*-setup.exe" | Select-Object -First 1
          $name = "wiener-xs20-bridge_${v}_x64-setup.exe"
          Copy-Item $src.FullName $name
          "$((Get-FileHash $name -Algorithm SHA256).Hash)  $name" | Out-File "SHA256SUMS.txt" -Encoding ascii

      - name: Publicar GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            wiener-xs20-bridge_*_x64-setup.exe
            SHA256SUMS.txt
          generate_release_notes: true
