name: Build Windows installer

on:
  push:
    branches: [master]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/ui/src-tauri -> target

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Run service tests
        run: bun run test

      - name: Build service binary
        run: bun run build:service:windows

      - name: Stage service binary into Tauri resources
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path apps/ui/src-tauri/binaries | Out-Null
          Copy-Item apps/service/dist/xs20-service.exe apps/ui/src-tauri/binaries/xs20-service.exe -Force

      - name: Build Tauri app
        run: bun run tauri:build

      - name: Upload NSIS installer
        uses: actions/upload-artifact@v4
        with:
          name: wiener-xs20-setup-nsis
          path: apps/ui/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

      - name: Upload MSI installer
        uses: actions/upload-artifact@v4
        with:
          name: wiener-xs20-setup-msi
          path: apps/ui/src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error
