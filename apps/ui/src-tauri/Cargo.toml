[package]
name = "wiener-xs20-ui"
version = "0.2.1"
description = "Wiener XS 20 Bridge — interfaz de escritorio"
authors = ["Craftly"]
edition = "2021"
rust-version = "1.70"

[build-dependencies]
tauri-build = { version = "1.5", features = [] }

[dependencies]
tauri = { version = "1.6", features = ["shell-open", "dialog-open"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# La feature custom-protocol se activa en el build de produccion (tauri build
# la enciende automaticamente). En dev queda apagada.
[features]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
